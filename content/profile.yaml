# Shown on the front page and at the top of the CV.
bio:
  en: >-
    I am a PhD candidate in Information and Communication Technologies,
    specializing in Cognitive Systems and Robotics, at the University of Granada,
    and a predoctoral researcher at the [Swarm Systems Lab](https://www.swarmsystemslab.eu).
    My research focuses on the control of autonomous robot swarms: I combine control
    theory, geometric methods and physical principles to develop distributed
    Guidance, Navigation and Control (GNC) algorithms for multi-robot systems, with
    an emphasis on distributed, resilient and experimentally validated solutions.
  es: >-
    Soy doctorando en Tecnologías de la Información y la Comunicación, en la
    especialidad de Sistemas Cognitivos y Robótica, en la Universidad de Granada,
    e investigador predoctoral en el [Swarm Systems Lab](https://www.swarmsystemslab.eu).
    Mi investigación se centra en el control de enjambres de robots autónomos: combino
    teoría de control, métodos geométricos y principios físicos para desarrollar
    algoritmos distribuidos de Guiado, Navegación y Control (GNC) para sistemas
    multi-robot, con énfasis en soluciones distribuidas, resilientes y validadas
    experimentalmente.

