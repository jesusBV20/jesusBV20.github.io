# The CV. The /cv page and the PDF (both languages) are generated from this
# file, profile.yaml, publications.yaml and talks.yaml on every build.
#
# Text is a plain string or { en: …, es: … } (Spanish falls back to English).
# Dates are YYYY or YYYY-MM; `end: present` for something ongoing.
# Inline Markdown works: **bold**, *italic*, [link](https://…).

# Which sections the CV shows, and in which order. Remove a line to drop a
# section from both the web page and the PDF.
#   education · experience · publications · talks · awards · skills · languages
sections: [education, experience, publications]

# The PDF look. One of RenderCV's themes:
#   classic · ember · engineeringclassic · engineeringresumes · harvard · ink
#   moderncv · opal · sb2nov
theme: classic

