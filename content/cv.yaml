experience:
  - position: { en: "Predoctoral Researcher", es: "Investigador predoctoral" }
    organization:
      en: "Swarm Systems Lab, Institute of Mathematics of Granada (IMAG), University of Granada"
      es: "Swarm Systems Lab, Instituto de Matemáticas de la Universidad de Granada (IMAG)"
    location: { en: "Granada, Spain", es: "Granada, España" }
    start: 2022-12
    end: present
    highlights:
      - en: "Development of distributed Guidance, Navigation and Control (GNC) algorithms for autonomous robot swarms, with particular emphasis on formation control, source seeking and cooperative motion."
        es: "Desarrollo de algoritmos distribuidos de Guiado, Navegación y Control (GNC) para enjambres de robots autónomos, con especial énfasis en control de formaciones, búsqueda de fuentes y movimiento cooperativo."
      - en: "Development and implementation of geometric control and guiding vector field algorithms for autonomous aerial vehicles, including fixed-wing aircraft."
        es: "Desarrollo e implementación de algoritmos de control geométrico y de campos vectoriales de guiado para vehículos aéreos autónomos, incluidos aviones de ala fija."
      - en: "Assembly, integration, maintenance and experimental validation of autonomous radio-controlled robot swarms involving both aerial and ground vehicles."
        es: "Montaje, integración, mantenimiento y validación experimental de enjambres de robots autónomos radiocontrolados, tanto aéreos como terrestres."
      - en: "Development of mathematical models and simulation tools to analyze the physical behavior and collective dynamics of autonomous vehicles and multi-robot systems."
        es: "Desarrollo de modelos matemáticos y herramientas de simulación para analizar el comportamiento físico y la dinámica colectiva de vehículos autónomos y sistemas multi-robot."
      - en: "Implementation and experimental validation of onboard autonomy algorithms on real fixed-wing drones, including formation flight, crosswind navigation and autonomous maneuvering."
        es: "Implementación y validación experimental de algoritmos de autonomía a bordo en drones de ala fija reales, incluidos vuelo en formación, navegación con viento cruzado y maniobras autónomas."
      - en: "Development of open-source software and reproducible simulation tools supporting research in distributed robot-swarm control."
        es: "Desarrollo de software libre y herramientas de simulación reproducibles para la investigación en control distribuido de enjambres de robots."
      - en: "Research supported by the *ERC Starting Grant* iSwarm (101076091) and the *Ramón y Cajal* grant RYC2020-030090-I of the Spanish Ministry of Science."
        es: "Investigación financiada por la *ERC Starting Grant* iSwarm (101076091) y la ayuda *Ramón y Cajal* RYC2020-030090-I del Ministerio de Ciencia."

