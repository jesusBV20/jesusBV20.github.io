      es: "*Beca de colaboración* del Ministerio de Educación y Formación Profesional."
    highlights:
      - en: "Contributions to [Paparazzi UAS](https://github.com/paparazzi/paparazzi), an open-source hardware/software project for autonomous aerial vehicles."
        es: "Contribuciones a [Paparazzi UAS](https://github.com/paparazzi/paparazzi), un proyecto de hardware y software libre para vehículos aéreos autónomos."
      - en: "Maintenance and development of ground radio-controlled autonomous vehicles."
        es: "Mantenimiento y desarrollo de vehículos terrestres autónomos radiocontrolados."
      - en: "Development of drivers and embedded software for systems based on STM32 microcontrollers."
        es: "Desarrollo de drivers y software embebido para sistemas basados en microcontroladores STM32."

